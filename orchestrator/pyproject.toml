[project]
name = "sports-orchestrator"
version = "0.1.0"
description = "AI + data logic sub-system for sports-analytics"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",    
    "PyYAML>=6.0",      
    "sqlglot>=26",      
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",        
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]      

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]