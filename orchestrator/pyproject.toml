[project]
name = "sports-orchestrator"
version = "0.1.0"
description = "AI + data logic sub-system for sports-analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "redis>=5.0",
    "sqlglot>=26",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn>=0.32",
    "openai>=1.55",
    "chromadb>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]      

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires docker compose -f docker-compose.test.yml up -d",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]