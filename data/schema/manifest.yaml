version: 1
default_schema: sports

schemas:
  sports:
    description: Curated analytics-ready sports facts, filled by the ingestor.
    tables:
      leagues:
        description: One row per league. Anchor of every other table.
        primary_key: [code]
        columns:
          code:       {type: text,        description: "Stable league slug, e.g. 'NBA', 'LOL'."}
          name:       {type: text,        description: "Human-readable league name."}
          sport:      {type: text,        description: "'basketball' | 'esports' | 'synthetic'."}
          created_at: {type: timestamptz, description: "Row creation time. Rarely relevant to analytics."}
          updated_at: {type: timestamptz, description: "Last upsert time. Rarely relevant to analytics."}

      teams:
        description: Teams within leagues. Natural key (league_code, code).
        primary_key: [league_code, code]
        columns:
          league_code:  {type: text,        description: "FK -> leagues.code."}
          code:         {type: text,        description: "Stable team slug within its league, e.g. 'LAL'."}
          name:         {type: text,        description: "Human-readable team name."}
          abbreviation: {type: text,        description: "Short label; may be NULL."}
          conference:   {type: text,        description: "Conference/region grouping; may be NULL."}
          division:     {type: text,        description: "Division grouping; may be NULL."}
          external_id:  {type: text,        description: "Source-system id. Tracing only."}
          source:       {type: text,        description: "Origin source name. Tracing only."}
          created_at:   {type: timestamptz, description: "Row creation time."}
          updated_at:   {type: timestamptz, description: "Last upsert time."}

      games:
        description: One row per game/match. Score columns are NULL until final.
        primary_key: [league_code, game_code]
        columns:
          league_code:    {type: text,        description: "FK -> teams.league_code."}
          game_code:      {type: text,        description: "Deterministic slug, e.g. '2026-01-15-lal-bos'."}
          season:         {type: text,        description: "Season label, e.g. '2025-26', '2026-spring'."}
          starts_at:      {type: timestamptz, description: "Scheduled/actual start time (UTC)."}
          status:         {type: text,        description: "'scheduled' | 'live' | 'final' | 'postponed' | 'canceled'. 'final' = completed."}
          home_team_code: {type: text,        description: "FK -> teams.code."}
          away_team_code: {type: text,        description: "FK -> teams.code."}
          home_score:     {type: integer,     description: "Home team score; NULL until final."}
          away_score:     {type: integer,     description: "Away team score; NULL until final."}
          venue:          {type: text,        description: "Venue name; may be NULL."}
          created_at:     {type: timestamptz, description: "Row creation time."}
          updated_at:     {type: timestamptz, description: "Last upsert time."}

      players:
        description: Players within leagues. Natural key (league_code, code).
        primary_key: [league_code, code]
        columns:
          league_code: {type: text,        description: "FK -> teams.league_code."}
          code:        {type: text,        description: "Stable player slug, e.g. 'stephen-curry'."}
          full_name:   {type: text,        description: "Player's display name."}
          team_code:   {type: text,        description: "FK -> teams.code. NULL for free agents/retired."}
          position:    {type: text,        description: "Position; may be NULL."}
          active:      {type: boolean,     description: "TRUE if the player is currently season-active."}
          external_id: {type: text,        description: "Source-system id. Tracing only."}
          source:      {type: text,        description: "Origin source name. Tracing only."}
          created_at:  {type: timestamptz, description: "Row creation time."}
          updated_at:  {type: timestamptz, description: "Last upsert time."}

      player_stats:
        description: Long-format stats. One row per (game, player, stat_name) — see stat_name values.
        primary_key: [league_code, game_code, player_code, stat_name]
        columns:
          league_code: {type: text,    description: "FK -> games.league_code."}
          game_code:   {type: text,    description: "FK -> games.game_code."}
          player_code: {type: text,    description: "FK -> players.code."}
          stat_name:   {type: text,    description: "Stat key, e.g. 'points', 'rebounds', 'assists', 'kills', 'deaths'. Pivot needed to see all stats of one player-game."}
          stat_value:  {type: numeric, description: "Observed value for stat_name in that game."}
          created_at:  {type: timestamptz, description: "Row creation time."}
          updated_at:  {type: timestamptz, description: "Last upsert time."}

relations:
  - "teams.league_code = leagues.code"
  - "games.league_code = teams.league_code AND games.home_team_code = teams.code"
  - "games.league_code = teams.league_code AND games.away_team_code = teams.code"
  - "players.league_code = teams.league_code AND players.team_code = teams.code"
  - "player_stats.league_code = games.league_code AND player_stats.game_code = games.game_code"
  - "player_stats.league_code = players.league_code AND player_stats.player_code = players.code"